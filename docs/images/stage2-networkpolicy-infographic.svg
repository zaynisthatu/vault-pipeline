<svg viewBox="0 0 800 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrowGrayN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  <marker id="arrowRedN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  <marker id="arrowGreenN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>

  <symbol id="icon-shieldN" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L20 5 V11 C20 16 16.5 20 12 22 C7.5 20 4 16 4 11 V5 Z"/>
  </symbol>
  <symbol id="icon-server2" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/>
    <circle cx="6" cy="7" r="0.7" fill="#fff" stroke="none"/><circle cx="6" cy="17" r="0.7" fill="#fff" stroke="none"/>
  </symbol>
  <symbol id="icon-x2" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/><line x1="8" y1="8" x2="16" y2="16"/><line x1="16" y1="8" x2="8" y2="16"/>
  </symbol>
  <symbol id="icon-check3" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/><path d="M7 12.5 L10.5 16 L17 8.5"/>
  </symbol>
</defs>

<rect x="0" y="0" width="800" height="720" fill="#ffffff"/>

<!-- HEADER -->
<rect x="40" y="30" width="54" height="54" rx="12" fill="#1e3a8a"/>
<use href="#icon-shieldN" x="50" y="40" width="34" height="34"/>
<text x="110" y="55" font-size="21" font-weight="700" fill="#0f172a">NETWORKPOLICY ACCEPTED</text>
<text x="110" y="82" font-size="21" font-weight="700" fill="#dc2626">BUT NOT ENFORCED</text>
<line x1="40" y1="105" x2="760" y2="105" stroke="#2563eb" stroke-width="3"/>

<!-- Box 1 -->
<rect x="290" y="135" width="220" height="65" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="305" y="147" width="42" height="42" rx="9" fill="#2563eb"/><use href="#icon-shieldN" x="313" y="155" width="26" height="26"/>
<text x="357" y="163" font-size="13" font-weight="700" fill="#1e3a8a">NETWORKPOLICY</text>
<text x="357" y="180" font-size="10.5" fill="#3b5998">default-deny + allow Traefik</text>

<line x1="400" y1="200" x2="400" y2="225" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGrayN)"/>

<!-- Box 2 -->
<rect x="270" y="227" width="260" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="285" y="237" width="40" height="40" rx="9" fill="#2563eb"/><use href="#icon-server2" x="292" y="244" width="26" height="26"/>
<text x="340" y="262" font-size="13" font-weight="700" fill="#1e3a8a">KUBE-APISERVER</text>
<text x="340" y="278" font-size="10.5" fill="#3b5998">accepts the manifest</text>

<line x1="400" y1="287" x2="400" y2="312" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGrayN)"/>

<!-- Decision diamond -->
<polygon points="400,315 470,370 400,425 330,370" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
<text x="400" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">CNI</text>
<text x="400" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">PLUGIN?</text>

<!-- Left branch: Flannel -->
<line x1="345" y1="392" x2="220" y2="450" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRedN)"/>
<rect x="180" y="418" width="80" height="24" rx="6" fill="#fee2e2"/>
<text x="220" y="434" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">FLANNEL</text>

<!-- Right branch: Calico/Cilium -->
<line x1="455" y1="392" x2="580" y2="450" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreenN)"/>
<rect x="530" y="418" width="140" height="24" rx="6" fill="#dcfce7"/>
<text x="600" y="434" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">CALICO / CILIUM</text>

<!-- Left outcome card -->
<rect x="80" y="470" width="300" height="130" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<rect x="98" y="486" width="46" height="46" rx="10" fill="#dc2626"/><use href="#icon-x2" x="106" y="494" width="30" height="30"/>
<text x="156" y="504" font-size="14.5" font-weight="700" fill="#7f1d1d">POLICY STORED,</text>
<text x="156" y="522" font-size="14.5" font-weight="700" fill="#7f1d1d">NOT ENFORCED</text>
<text x="98" y="558" font-size="12" fill="#991b1b">All pod-to-pod traffic still flows —</text>
<text x="98" y="576" font-size="12" fill="#991b1b">the API stores the object, nothing</text>
<text x="98" y="594" font-size="12" fill="#991b1b">reads or acts on it.</text>

<!-- Right outcome card -->
<rect x="420" y="470" width="300" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<rect x="438" y="486" width="46" height="46" rx="10" fill="#16a34a"/><use href="#icon-check3" x="446" y="494" width="30" height="30"/>
<text x="496" y="504" font-size="14.5" font-weight="700" fill="#14532d">POLICY ENFORCED</text>
<text x="496" y="522" font-size="14.5" font-weight="700" fill="#14532d">AT NETWORK LAYER</text>
<text x="438" y="558" font-size="12" fill="#166534">Same manifest, zero changes —</text>
<text x="438" y="576" font-size="12" fill="#166534">this is how it becomes effective</text>
<text x="438" y="594" font-size="12" fill="#166534">on a managed cloud cluster.</text>

<!-- Bottom takeaway -->
<rect x="40" y="625" width="720" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="60" y="653" font-size="13" font-weight="700" letter-spacing="1" fill="#334155">WHY IT MATTERS</text>
<text x="60" y="674" font-size="12.5" fill="#475569">k3d's default CNI is Flannel — documented as a known gap rather than silently patched over.</text>
</svg>
