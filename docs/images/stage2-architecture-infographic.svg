<svg viewBox="0 0 800 1550" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>

  <symbol id="icon-browser" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="9" x2="22" y2="9"/>
    <circle cx="5" cy="6.5" r="0.6" fill="#fff" stroke="none"/><circle cx="7.5" cy="6.5" r="0.6" fill="#fff" stroke="none"/>
  </symbol>
  <symbol id="icon-hub" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/><circle cx="4" cy="5" r="2"/><circle cx="20" cy="5" r="2"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="19" r="2"/>
    <line x1="12" y1="12" x2="4" y2="5"/><line x1="12" y1="12" x2="20" y2="5"/><line x1="12" y1="12" x2="4" y2="19"/><line x1="12" y1="12" x2="20" y2="19"/>
  </symbol>
  <symbol id="icon-gate" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="8" height="18" rx="1"/><path d="M13 12 H21 M17 8 L21 12 L17 16"/>
  </symbol>
  <symbol id="icon-service" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="4" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/>
    <line x1="12" y1="12" x2="12" y2="4"/><line x1="12" y1="12" x2="5" y2="18"/><line x1="12" y1="12" x2="19" y2="18"/>
  </symbol>
  <symbol id="icon-pod" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12,2 21,7 21,17 12,22 3,17 3,7"/><circle cx="12" cy="12" r="2" fill="#fff" stroke="none"/>
  </symbol>
  <symbol id="icon-container" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="6" width="20" height="12" rx="1"/><line x1="7" y1="6" x2="7" y2="18"/><line x1="12" y1="6" x2="12" y2="18"/><line x1="17" y1="6" x2="17" y2="18"/>
  </symbol>
  <symbol id="icon-db" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5 V19 A8 3 0 0 0 20 19 V5"/><path d="M4 12 A8 3 0 0 0 20 12"/>
  </symbol>
  <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/><path d="M7 12.5 L10.5 16 L17 8.5" stroke-width="2"/>
  </symbol>
  <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L20 5 V11 C20 16 16.5 20 12 22 C7.5 20 4 16 4 11 V5 Z"/>
  </symbol>
  <symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11 V7 a4 4 0 0 1 8 0 V11"/>
  </symbol>
  <symbol id="icon-cloud" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 18 a4 4 0 0 1 -1 -7.9 a5 5 0 0 1 9.6 -1.6 a4.5 4.5 0 0 1 -0.6 9.5 Z"/>
  </symbol>
  <symbol id="icon-bulb" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18 h6 M10 21 h4 M12 2 a6 6 0 0 0 -3 11.2 c0.6 0.5 1 1.2 1 2.1 v0.7 h4 v-0.7 c0 -0.9 0.4 -1.6 1 -2.1 A6 6 0 0 0 12 2 Z"/>
  </symbol>
</defs>

<rect x="0" y="0" width="800" height="1550" fill="#ffffff"/>

<!-- HEADER -->
<rect x="40" y="30" width="54" height="54" rx="12" fill="#1e3a8a"/>
<use href="#icon-service" x="50" y="40" width="34" height="34"/>
<text x="110" y="58" font-size="25" font-weight="700" fill="#0f172a">HOW A REQUEST REACHES</text>
<text x="110" y="90" font-size="25" font-weight="700" fill="#0f172a">VAULT <tspan fill="#2563eb">IN KUBERNETES</tspan></text>

<line x1="40" y1="122" x2="255" y2="122" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="400" y="126" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1" fill="#64748b">A SIMPLE END-TO-END REQUEST FLOW</text>
<line x1="545" y1="122" x2="760" y2="122" stroke="#cbd5e1" stroke-width="1.5"/>

<line x1="40" y1="165" x2="760" y2="165" stroke="#2563eb" stroke-width="3"/>

<!-- STEP 1 -->
<rect x="40" y="195" width="380" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<circle cx="65" cy="235" r="16" fill="#1e3a8a"/><text x="65" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
<rect x="95" y="205" width="60" height="60" rx="12" fill="#2563eb"/><use href="#icon-browser" x="108" y="218" width="34" height="34"/>
<text x="172" y="240" font-size="15.5" font-weight="700" fill="#1e293b">BROWSER</text>
<line x1="420" y1="235" x2="450" y2="235" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="2,3"/>
<text x="460" y="228" font-size="12.5" fill="#475569">User opens vault.local — the</text>
<text x="460" y="246" font-size="12.5" fill="#475569">request leaves the machine.</text>
<line x1="125" y1="275" x2="125" y2="303" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowHead)"/>

<!-- STEP 2 -->
<rect x="40" y="305" width="380" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<circle cx="65" cy="345" r="16" fill="#1e3a8a"/><text x="65" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
<rect x="95" y="315" width="60" height="60" rx="12" fill="#ea580c"/><use href="#icon-hub" x="108" y="328" width="34" height="34"/>
<text x="172" y="342" font-size="15.5" font-weight="700" fill="#1e293b">K3D LOAD BALANCER</text>
<line x1="420" y1="345" x2="450" y2="345" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="2,3"/>
<text x="460" y="338" font-size="12.5" fill="#475569">Receives external traffic on port</text>
<text x="460" y="356" font-size="12.5" fill="#475569">80, forwards it toward ingress.</text>
<line x1="125" y1="385" x2="125" y2="413" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowHead)"/>

<!-- STEP 3 -->
<rect x="40" y="415" width="380" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<circle cx="65" cy="455" r="16" fill="#1e3a8a"/><text x="65" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
<rect x="95" y="425" width="60" height="60" rx="12" fill="#16a34a"/><use href="#icon-gate" x="108" y="438" width="34" height="34"/>
<text x="172" y="452" font-size="15.5" font-weight="700" fill="#1e293b">TRAEFIK INGRESS</text>
<line x1="420" y1="455" x2="450" y2="455" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="2,3"/>
<text x="460" y="448" font-size="12.5" fill="#475569">Reads the Host header (vault.local)</text>
<text x="460" y="466" font-size="12.5" fill="#475569">and routes to the matching service.</text>
<line x1="125" y1="495" x2="125" y2="523" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowHead)"/>

<!-- STEP 4 -->
<rect x="40" y="525" width="380" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<circle cx="65" cy="565" r="16" fill="#1e3a8a"/><text x="65" y="570" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
<rect x="95" y="535" width="60" height="60" rx="12" fill="#0284c7"/><use href="#icon-service" x="108" y="548" width="34" height="34"/>
<text x="172" y="562" font-size="14.5" font-weight="700" fill="#1e293b">VAULT-SERVICE (CLUSTERIP)</text>
<line x1="420" y1="565" x2="450" y2="565" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="2,3"/>
<text x="460" y="558" font-size="12.5" fill="#475569">Stable internal endpoint that load-</text>
<text x="460" y="576" font-size="12.5" fill="#475569">balances across the healthy pods.</text>
<line x1="125" y1="605" x2="125" y2="633" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowHead)"/>

<!-- STEP 5 -->
<rect x="40" y="635" width="380" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<circle cx="65" cy="675" r="16" fill="#1e3a8a"/><text x="65" y="680" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
<rect x="95" y="645" width="60" height="60" rx="12" fill="#9333ea"/><use href="#icon-pod" x="108" y="658" width="34" height="34"/>
<text x="172" y="672" font-size="15" font-weight="700" fill="#1e293b">VAULT POD (1 OF 2)</text>
<line x1="420" y1="675" x2="450" y2="675" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="2,3"/>
<text x="460" y="668" font-size="12.5" fill="#475569">Scheduled on agent-0 or agent-1 —</text>
<text x="460" y="686" font-size="12.5" fill="#475569">whichever pod matches the selector.</text>
<line x1="125" y1="715" x2="125" y2="743" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowHead)"/>

<!-- STEP 6 -->
<rect x="40" y="745" width="380" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<circle cx="65" cy="785" r="16" fill="#1e3a8a"/><text x="65" y="790" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
<rect x="95" y="755" width="60" height="60" rx="12" fill="#0d9488"/><use href="#icon-container" x="108" y="768" width="34" height="34"/>
<text x="172" y="782" font-size="15.5" font-weight="700" fill="#1e293b">CONTAINER</text>
<line x1="420" y1="785" x2="450" y2="785" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="2,3"/>
<text x="460" y="778" font-size="12.5" fill="#475569">The Node.js/Express process inside</text>
<text x="460" y="796" font-size="12.5" fill="#475569">the pod handles the request.</text>
<line x1="125" y1="825" x2="125" y2="853" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowHead)"/>

<!-- STEP 7 -->
<rect x="40" y="855" width="380" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<circle cx="65" cy="895" r="16" fill="#1e3a8a"/><text x="65" y="900" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">7</text>
<rect x="95" y="865" width="60" height="60" rx="12" fill="#d97706"/><use href="#icon-db" x="108" y="878" width="34" height="34"/>
<text x="172" y="892" font-size="15" font-weight="700" fill="#1e293b">VAULT.DB (EMPTYDIR)</text>
<line x1="420" y1="895" x2="450" y2="895" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="2,3"/>
<text x="460" y="888" font-size="12.5" fill="#475569">Pod reads and writes SQLite data</text>
<text x="460" y="906" font-size="12.5" fill="#475569">through the mounted volume.</text>
<line x1="125" y1="935" x2="125" y2="963" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowHead)"/>

<!-- STEP 8 -->
<rect x="40" y="965" width="380" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<circle cx="65" cy="1005" r="16" fill="#1e3a8a"/><text x="65" y="1010" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">8</text>
<rect x="95" y="975" width="60" height="60" rx="12" fill="#16a34a"/><use href="#icon-check" x="108" y="988" width="34" height="34"/>
<text x="172" y="1002" font-size="15" font-weight="700" fill="#1e293b">RESPONSE RETURNED</text>
<line x1="420" y1="1005" x2="450" y2="1005" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="2,3"/>
<text x="460" y="998" font-size="12.5" fill="#475569">Travels back the same path: Pod →</text>
<text x="460" y="1016" font-size="12.5" fill="#475569">Service → Ingress → LB → Browser.</text>
<line x1="125" y1="1045" x2="125" y2="1065" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowHead)"/>

<!-- SUMMARY STRIP -->
<rect x="30" y="1075" width="740" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="50" y="1100" font-size="13" font-weight="700" letter-spacing="1" fill="#334155">AT A GLANCE</text>

<rect x="71.75" y="1120" width="44" height="44" rx="10" fill="#2563eb"/><use href="#icon-browser" x="80.75" y="1129" width="26" height="26"/>
<text x="93.75" y="1180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2563eb">BROWSER</text>

<rect x="159.25" y="1120" width="44" height="44" rx="10" fill="#ea580c"/><use href="#icon-hub" x="168.25" y="1129" width="26" height="26"/>
<text x="181.25" y="1180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ea580c">LB</text>

<rect x="246.75" y="1120" width="44" height="44" rx="10" fill="#16a34a"/><use href="#icon-gate" x="255.75" y="1129" width="26" height="26"/>
<text x="268.75" y="1180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#16a34a">INGRESS</text>

<rect x="334.25" y="1120" width="44" height="44" rx="10" fill="#0284c7"/><use href="#icon-service" x="343.25" y="1129" width="26" height="26"/>
<text x="356.25" y="1180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0284c7">SERVICE</text>

<rect x="421.75" y="1120" width="44" height="44" rx="10" fill="#9333ea"/><use href="#icon-pod" x="430.75" y="1129" width="26" height="26"/>
<text x="443.75" y="1180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9333ea">POD</text>

<rect x="509.25" y="1120" width="44" height="44" rx="10" fill="#0d9488"/><use href="#icon-container" x="518.25" y="1129" width="26" height="26"/>
<text x="531.25" y="1180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0d9488">CONTAINER</text>

<rect x="596.75" y="1120" width="44" height="44" rx="10" fill="#d97706"/><use href="#icon-db" x="605.75" y="1129" width="26" height="26"/>
<text x="618.75" y="1180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#d97706">DB</text>

<rect x="684.25" y="1120" width="44" height="44" rx="10" fill="#16a34a"/><use href="#icon-check" x="693.25" y="1129" width="26" height="26"/>
<text x="706.25" y="1180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#16a34a">RESPONSE</text>

<!-- SUPPORTING CONTROLS -->
<text x="50" y="1250" font-size="13" font-weight="700" letter-spacing="1" fill="#334155">SUPPORTING CONTROLS</text>

<rect x="40" y="1270" width="227" height="120" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,3"/>
<rect x="55" y="1285" width="44" height="44" rx="10" fill="#ea580c"/><use href="#icon-shield" x="64" y="1294" width="26" height="26"/>
<text x="110" y="1305" font-size="13" font-weight="700" fill="#7c2d12">NETWORKPOLICY</text>
<text x="55" y="1332" font-size="11" fill="#475569">Default-deny + allow Traefik —</text>
<text x="55" y="1348" font-size="11" fill="#475569">intended enforcement layer.</text>

<rect x="287" y="1270" width="227" height="120" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,3"/>
<rect x="302" y="1285" width="44" height="44" rx="10" fill="#ea580c"/><use href="#icon-lock" x="311" y="1294" width="26" height="26"/>
<text x="357" y="1298" font-size="13" font-weight="700" fill="#7c2d12">POD DISRUPTION</text>
<text x="357" y="1314" font-size="13" font-weight="700" fill="#7c2d12">BUDGET</text>
<text x="302" y="1338" font-size="11" fill="#475569">minAvailable: 1 — protects</text>
<text x="302" y="1354" font-size="11" fill="#475569">pods during disruption.</text>

<rect x="534" y="1270" width="227" height="120" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="2" stroke-dasharray="6,3"/>
<rect x="549" y="1285" width="44" height="44" rx="10" fill="#9333ea"/><use href="#icon-cloud" x="558" y="1294" width="26" height="26"/>
<text x="604" y="1298" font-size="13" font-weight="700" fill="#581c87">GHCR</text>
<text x="604" y="1314" font-size="13" font-weight="700" fill="#581c87">(PRIVATE IMAGE)</text>
<text x="549" y="1338" font-size="11" fill="#475569">Pulled into pods via</text>
<text x="549" y="1354" font-size="11" fill="#475569">imagePullSecret.</text>

<!-- KEY TAKEAWAY -->
<rect x="40" y="1420" width="720" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="58" y="1438" width="50" height="50" rx="12" fill="#2563eb"/><use href="#icon-bulb" x="68" y="1448" width="30" height="30"/>
<text x="126" y="1452" font-size="13" font-weight="700" letter-spacing="1" fill="#1e3a8a">KEY TAKEAWAY</text>
<text x="126" y="1474" font-size="12.5" fill="#334155">A Service gives pods a stable endpoint; Ingress manages external</text>
<text x="126" y="1492" font-size="12.5" fill="#334155">routing — together they decouple the app from any single pod.</text>
</svg>
