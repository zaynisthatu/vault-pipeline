apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: vault
          image: ghcr.io/zaynisthatu/vault-pipeline:latest
          ports:
            - containerPort: 7860
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 7860
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 7860
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3